---
# Reusable app workflow of the shirtracer platform: validate the app with the pinned policy
# bundle, build and push its image under an immutable tag, and send the deploy (or offboard)
# request to the platform with the job's identity token and the app secrets named in
# platform.yaml. Public so that repositories of any owner can call it; only repositories
# registered on the platform deploy (the platform checks repository, owner, default branch and
# that the request came from this workflow at a released ref). Call it at @v1 (the moving major
# tag) or at an exact release @v1.x.y, never at a branch. Third-party actions are pinned by
# commit. Nothing secret lives here.
#
# Several servers (D35): the input `platform` names the server the app deploys to (or is
# offboarded from). Its profile in PLATFORM_SERVERS gives the deploy URL (also the identity
# token's audience) and the env variable holding its policy bundle pin, so one server's bundle
# never goes with another server's URL or audience. POLICY_BUNDLE is the apps server's pin;
# another server's pin is POLICY_BUNDLE_<SERVER>. A known server without a profile (null) is
# not available yet.
#
# Fewer billed minutes (D40, v1.3.0): one job validates and builds, with a build cache per app
# (the tag buildcache in the app's package, written only on the push path); a newer run on the
# same ref cancels an older one while it validates or builds, but never a request already sent.
name: platform app

"on":
  workflow_call:
    inputs:
      action:
        description: deploy or offboard
        type: string
        default: deploy
      confirm:
        description: "offboard only: the app name"
        type: string
        default: ""
      environment:
        description: GitHub Environment whose secrets are sent
        type: string
        default: production
      platform:
        description: "the server: apps (default) or shops"
        type: string
        default: apps
      controller-url:
        description: "deprecated: the server's deploy URL comes from platform; if set, it must equal it"
        type: string
        default: ""
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: "."
    secrets:
      # The caller's repository secrets as one value (`PLATFORM_SECRETS: ${{ toJSON(secrets) }}`):
      # `secrets: inherit` passes nothing to a workflow of another owner, and app secret names
      # differ per app. Environment secrets of the caller's `production` environment still reach
      # the request jobs directly and take precedence (verified 2026-10-26).
      PLATFORM_SECRETS:
        description: "toJSON(secrets) of the caller"
        required: false

permissions: {}

env:
  # The apps server's policy bundle: <registry path>:<version>@sha256:<digest>
  # Must equal the server's pin: the server refuses requests validated with another version
  # and its admin check compares both (another server: POLICY_BUNDLE_<SERVER>, its own package
  # platform-policy-<server>).
  POLICY_BUNDLE: >-
    ghcr.io/svenm3/platform-policy:2.5.0@sha256:8272cf91051b394319e4b908952ffba723828b9bb91155cf8e0af4506fa47eee
  # The shops server's policy bundle (package platform-policy-shops).
  POLICY_BUNDLE_SHOPS: >-
    ghcr.io/svenm3/platform-policy-shops:1.1.0@sha256:23533944cdff65d803e4829b9f40b300c4cf2bd890beb62b26fc21f13481de8a
  # The known servers: {server: {deploy_url, bundle (the env variable of its pin)} | null}.
  # null: known, not available yet (its domain and bundle come with its release).
  PLATFORM_SERVERS: >-
    {"apps": {"deploy_url": "https://deploy.platform.shirtracer.gmbh", "bundle": "POLICY_BUNDLE"},
    "shops": {"deploy_url": "https://deploy.shops.shirtracer.gmbh", "bundle": "POLICY_BUNDLE_SHOPS"}}
  CONFTEST_IMAGE: >-
    openpolicyagent/conftest:v0.70.1@sha256:82f23e0e1f3faf2f3798f4b1974676c1aed96b05c6656ec6820435c31867c532

jobs:
  # One job validates and builds (D40): every job is billed rounded up to a full minute, and the
  # validation alone takes seconds. The request jobs stay separate (environment secrets and the
  # identity token are granted only there).
  build:
    name: validate and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # A newer run on the same ref cancels this one while it validates or builds; nothing has been
    # sent to the server yet. The action is part of the group, so a manual offboard and a push
    # build never cancel each other.
    concurrency:
      group: platform-build-${{ github.repository }}-${{ github.ref }}-${{ inputs.action }}
      cancel-in-progress: true
    outputs:
      app: ${{ steps.manifest.outputs.app }}
      secret_names: ${{ steps.manifest.outputs.secret_names }}
      policy_version: ${{ steps.bundle.outputs.version }}
      deploy_branch: ${{ steps.branch.outputs.default }}
      server: ${{ steps.server.outputs.server }}
      deploy_url: ${{ steps.server.outputs.deploy_url }}
      image: ${{ steps.result.outputs.image }}
    steps:
      # The server's profile: deploy URL (= audience) and bundle pin, before anything is built or
      # sent. Tested by tests/test_server_select.py.
      - name: Server
        id: server
        env:
          PLATFORM: ${{ inputs.platform }}
          CONTROLLER_URL_INPUT: ${{ inputs.controller-url }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          def fail(message):
              print("::error::" + message)
              sys.exit(1)

          env = os.environ
          servers = json.loads(env["PLATFORM_SERVERS"])
          known = ", ".join(servers)
          server = (env.get("PLATFORM") or "apps").strip()
          if server not in servers:
              fail("unknown platform %s (known: %s)" % (server, known))
          profile = servers[server]
          if not profile:
              fail("the server %s isn't available yet (known: %s)" % (server, known))
          url = str(profile.get("deploy_url") or "").rstrip("/")
          if not re.fullmatch(r"https://deploy\.[a-z0-9.-]+", url):
              fail("no deploy URL for %s in PLATFORM_SERVERS" % server)
          variable = str(profile.get("bundle") or "")
          bundle = env.get(variable, "").strip() if variable else ""
          package = "platform-policy" if server == "apps" else "platform-policy-" + server
          pin = (r"ghcr\.io/[a-z0-9_.-]+/%s:([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)@sha256:[0-9a-f]{64}"
                 % re.escape(package))
          match = re.fullmatch(pin, bundle)
          if not match:
              fail("no policy bundle pinned for %s (%s)" % (server, variable or "bundle"))
          given = (env.get("CONTROLLER_URL_INPUT") or "").strip().rstrip("/")
          if given:
              if given != url:
                  fail("controller-url %s is not the deploy URL of %s; use the platform input only"
                       % (given, server))
              print("::warning::controller-url is deprecated; the platform input selects the server")
          with open(env["GITHUB_OUTPUT"], "a") as out:
              out.write("server=%s\ndeploy_url=%s\nbundle=%s\nversion=%s\n"
                        % (server, url, bundle, match.group(1)))
          with open(env.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as summary:
              summary.write("### Server\n\n%s: %s, policy %s\n" % (server, url, match.group(1)))
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PUSH (for the later steps, as env.PUSH): the push path is the default branch on a push or a
      # manual run; only it writes the cache and pushes the image. Set here because a job's env
      # can't read its own steps.
      - name: Default branch
        id: branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "default=true" >>"$GITHUB_OUTPUT"
            case "$GITHUB_EVENT_NAME" in
              push|workflow_dispatch) echo "PUSH=true" >>"$GITHUB_ENV" ;;
              *) echo "PUSH=false" >>"$GITHUB_ENV" ;;
            esac
          else
            echo "default=false" >>"$GITHUB_OUTPUT"
            echo "PUSH=false" >>"$GITHUB_ENV"
          fi

      - name: Policy bundle pin
        id: bundle
        env:
          BUNDLE: ${{ steps.server.outputs.bundle }}
        run: |
          pin='^ghcr\.io/[a-z0-9_.-]+/platform-policy(-[a-z0-9]+)?:[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?@sha256:[0-9a-f]{64}$'
          if ! printf '%s' "$BUNDLE" | grep -Eq "$pin"; then
            echo "::error::no policy bundle pinned in the platform workflow"
            exit 1
          fi
          version="${BUNDLE#*:}"
          echo "version=${version%@*}" >>"$GITHUB_OUTPUT"

      # The bundle is public: no registry login.
      - name: Pull the policy bundle
        env:
          BUNDLE: ${{ steps.server.outputs.bundle }}
        run: |
          docker run --rm -v "$RUNNER_TEMP:/out" -w /out \
            "$CONFTEST_IMAGE" pull "oci://$BUNDLE" -p bundle

      - name: Validate platform.yaml and deploy/compose.yaml
        env:
          POLICY_VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set +e
          out="$(docker run --rm --network none -v "$PWD:/app:ro" -v "$RUNNER_TEMP/bundle:/bundle:ro" -w /app \
            "$CONFTEST_IMAGE" test --combine --no-color -p /bundle/policy -d /bundle/policy/data \
            platform.yaml deploy/compose.yaml 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          {
            echo "### Policy ${POLICY_VERSION}"
            echo ""
            if [ "$rc" -eq 0 ]; then
              echo "All rules pass."
            else
              echo '```'
              printf '%s\n' "$out" | grep '^FAIL' || printf '%s\n' "$out"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: App name and secret names
        id: manifest
        run: |
          doc="$(docker run --rm --network none -v "$PWD:/app:ro" -w /app "$CONFTEST_IMAGE" parse platform.yaml |
            jq -c 'if type == "array" then map(select(. != null))[0] else . end')"
          echo "app=$(printf '%s' "$doc" | jq -r '.name')" >>"$GITHUB_OUTPUT"
          echo "secret_names=$(printf '%s' "$doc" | jq -c '.secrets // []')" >>"$GITHUB_OUTPUT"

      # The build (deploy action only). The cache is the tag buildcache in the app's own package,
      # with all intermediate layers (mode=max); every build reads it, only the push path writes it.
      - name: Image name
        id: name
        if: inputs.action == 'deploy'
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "name=ghcr.io/$repo"
            echo "tag=ghcr.io/$repo:sha-$GITHUB_SHA"
            echo "cache=ghcr.io/$repo:buildcache"
          } >>"$GITHUB_OUTPUT"

      # The push path needs the login (it pushes the image and the cache). Pull requests and manual
      # runs on other branches log in only to read the cache; a failed login there (a fork's token,
      # a package that doesn't exist yet) builds without it. Nothing is pushed off the push path.
      - name: Log in to GHCR
        if: inputs.action == 'deploy'
        continue-on-error: ${{ env.PUSH != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An existing tag is never rebuilt or overwritten (immutable tags).
      - name: Existing image
        id: existing
        if: inputs.action == 'deploy' && env.PUSH == 'true'
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          digest="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' 2>/dev/null |
            jq -r '.digest' || true)"
          if [ -n "$digest" ] && [ "$digest" != "null" ]; then
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
            echo "Image $TAG exists ($digest); not rebuilt." >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.action == 'deploy' && steps.existing.outputs.digest == ''

      # cache-from: a missing or unreadable cache only warns. cache-to: only on the push path, and
      # ignore-error keeps a failed cache export from failing the deploy.
      - name: Build (and push on the default branch)
        id: build
        if: inputs.action == 'deploy' && steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.name.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.name.outputs.cache }}
          cache-to: >-
            ${{ env.PUSH == 'true'
                && format('type=registry,ref={0},mode=max,ignore-error=true', steps.name.outputs.cache)
                || '' }}
          # Links a new package to its repository when first published (access follows the repository).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false

      - name: Result
        id: result
        if: inputs.action == 'deploy' && env.PUSH == 'true'
        env:
          TAG: ${{ steps.name.outputs.tag }}
          EXISTING: ${{ steps.existing.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING:-$BUILT}"
          [ -n "$digest" ] || { echo "::error::no image digest"; exit 1; }
          echo "image=$TAG@$digest" >>"$GITHUB_OUTPUT"
          echo "Image: \`$TAG@$digest\`" >>"$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    # A sent request is never cancelled: a newer deploy on the same ref waits for this one, and of
    # several waiting deploys only the newest is sent (the older waiting one is cancelled).
    concurrency:
      group: platform-deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      inputs.action == 'deploy' && needs.build.outputs.deploy_branch == 'true'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Send the deploy request
        env:
          ACTION: deploy
          CONTROLLER_URL: ${{ needs.build.outputs.deploy_url }}
          APP: ${{ needs.build.outputs.app }}
          IMAGE: ${{ needs.build.outputs.image }}
          POLICY_VERSION: ${{ needs.build.outputs.policy_version }}
          SECRET_NAMES: ${{ needs.build.outputs.secret_names }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: &request |
          # app-request: builds the request, sends it with the job's identity token and streams
          # the answer. Tested by tests/test_app_request.py.
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          def fail(message):
              print("::error::" + message)
              sys.exit(1)

          env = os.environ
          action, base = env["ACTION"], env["CONTROLLER_URL"].rstrip("/")
          body = {"app": env["APP"], "commit": env["GITHUB_SHA"]}
          if action == "deploy":
              names = json.loads(env.get("SECRET_NAMES") or "[]")
              available = json.loads(env.get("SECRETS_JSON") or "{}")
              # Repository secrets arrive bundled (PLATFORM_SECRETS); secrets that arrive directly
              # (the caller's Environment) take precedence.
              bundled = available.pop("PLATFORM_SECRETS", "") or ""
              if bundled:
                  try:
                      bundle = json.loads(bundled)
                  except ValueError:
                      fail("PLATFORM_SECRETS is not the caller's secrets as JSON")
                  for name in names:
                      value = bundle.get(name) if isinstance(bundle, dict) else None
                      if isinstance(value, str) and value and not available.get(name):
                          for part in value.splitlines() or [value]:
                              if part.strip():
                                  print("::add-mask::" + part)
                          available[name] = value
              missing = [n for n in names if not available.get(n)]
              if missing:
                  fail("secrets missing (Environment production or repository secrets; the caller "
                       "passes them as PLATFORM_SECRETS): " + ", ".join(missing))
              # Values from the secrets context are masked by GitHub; never print them here.
              body.update({"image": env["IMAGE"], "policy_version": env["POLICY_VERSION"],
                           "secrets": {n: available[n] for n in names}})
          else:
              body["confirm"] = env["CONFIRM"]

          # The job's identity token for the platform's audience (needs id-token: write).
          req = urllib.request.Request(env["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + base)
          req.add_header("Authorization", "Bearer " + env["ACTIONS_ID_TOKEN_REQUEST_TOKEN"])
          with urllib.request.urlopen(req, timeout=30) as resp:
              token = json.load(resp)["value"]
          print("::add-mask::" + token)

          req = urllib.request.Request(base + "/v1/" + action, data=json.dumps(body).encode(), method="POST")
          req.add_header("Content-Type", "application/json")
          req.add_header("Authorization", "Bearer " + token)
          result = None
          try:
              with urllib.request.urlopen(req, timeout=1800) as resp:
                  for raw in resp:
                      event = json.loads(raw)
                      if event.get("event") == "result":
                          result = event
                      else:
                          print(event.get("message", ""))
          except urllib.error.HTTPError as err:
              try:
                  result = json.loads(err.read())
              except ValueError:
                  result = {"outcome": "refused", "reason": "HTTP %d" % err.code}
          except (urllib.error.URLError, TimeoutError) as err:
              fail("deploy API not reachable: %s" % getattr(err, "reason", err))
          result = result or {"outcome": "failed", "reason": "no result from the deploy API"}
          line = "%s %s: %s — %s" % (action, env["APP"], result.get("outcome"), result.get("reason", ""))
          print(line)
          with open(env.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as summary:
              summary.write("### %s\n\n%s\n" % (action.capitalize(), line))
          if result.get("outcome") not in ("accepted", "succeeded"):
              sys.exit(1)
          PY

  offboard:
    needs: build
    if: >-
      inputs.action == 'offboard' && github.event_name == 'workflow_dispatch'
      && needs.build.outputs.deploy_branch == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Confirmation
        env:
          APP: ${{ needs.build.outputs.app }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$APP" ]; then
            echo "::error::type the app name ($APP) as confirmation to offboard; nothing was sent"
            exit 1
          fi

      - name: Send the offboard request
        env:
          ACTION: offboard
          CONTROLLER_URL: ${{ needs.build.outputs.deploy_url }}
          APP: ${{ needs.build.outputs.app }}
          CONFIRM: ${{ inputs.confirm }}
        run: *request
